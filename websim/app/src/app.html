<!DOCTYPE html>
<html lang="en" data-theme="light">

		<title>logue-sdk drone (chain)</title>
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />

			rel="stylesheet"

		<div style="display: contents">%sveltekit.body%</div>
