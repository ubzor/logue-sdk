<!DOCTYPE html>
<html>
<!-- TODO: make sure headroom is the same as the hardware -->

<head>
  <meta charset="utf-8">
  <title>logue-sdk osc</title>
  <script src="scripts/qwerty-hancock.js"></script>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      -webkit-font-smoothing: subpixel-antialiased;
    }
  </style>
</head>

<body>
  <!-- add buttons and sliders here -->
  <button id="TogglePlaybackButton">Toggle playback</button>
  <h2>Master Volume</h2>
  <input type="range" min=0 max=1 value=0.5 step=0.01 id="VolumeSlider">
  <span id="VolumeLabel"></span>

  <!-- <h2>BPM</h2>
  <input type="range" min=30 max=240 value=120 step=0.1 id="BpmSlider">
  <span id="BpmLabel"></span> -->

  <h2>Oscillator</h2>
  <p>Tips: play with a QWERTY keyboard, Z and X to switch octave </p>
  <!-- <select id="OscillatorType">
    <option value="sawtooth">Sawtooth</option>
    <option value="square">Square</option>
    <option value="triangle">Triangle</option>
    <option value="sine">Sine</option>
    <option value="noise">Noise</option>
  </select> -->
  <button id="OscLatchButton">Latch Off</button>
  <div id="keyboard"></div>

  <h2>Scope</h2>
  <canvas id="TimeDomain" width="512" height="128"></canvas><br />
  <canvas id="FrequencyDomain" width="512" height="128"></canvas>

  <h2>LFO (Shape)</h2>
  <p>Simulates the hardware OSC-button A/B knobs (F = frequency, S = depth).</p>
  <div>
    <label style="display:inline-block; width:100px; margin-right:10px;">F (freq, Hz)</label>
    <input type="range" min="0" max="30" value="1" step="0.01" id="LfoFreq" style="width:200px; margin-right:10px;">
    <span id="LfoFreqLabel">1.00</span>
  </div>
  <div>
    <label style="display:inline-block; width:100px; margin-right:10px;">S (depth, %)</label>
    <input type="range" min="0" max="100" value="0" step="1" id="LfoDepth" style="width:200px; margin-right:10px;">
    <span id="LfoDepthLabel">0%</span>
  </div>

  <h2>Parameters</h2>
  <div id="Parameters"></div>

  <script>
    // Expose function globally so EM_ASM can call it
    window.setupWebAudioAndUI = function (context, wasmProcessor) {

      function approximatelyEqual(a, b, epsilon = 1e-4) {
        return Math.abs(a - b) < epsilon;
      }

      // k_unit_param_type_strings in common/runtime.h (enum order:
      // none=0, percent=1, db=2, cents=3, semi=4, oct=5, hertz=6, khertz=7,
      // bpm=8, msec=9, sec=10, enum=11, strings=12). We render a <select>
      // for strings-typed parameters (the A knob / PARAM selector) and a
      // plain range slider for everything else.
      const K_UNIT_PARAM_TYPE_STRINGS = 12;

      // Format the raw 10-bit value (0..1023) of one of the 8 A/B-knob
      // parameters for display. Index order matches the C++ SELECT enum:
      // 0 RATE AMT, 1 RATE SPD, 2 SUB, 3 FOLD, 4 ASYM, 5 WAVE A, 6 WAVE B,
      // 7 SUB2. Percentages for all except WAVE A/B (wavetable index 0..90)
      // and ASYM (-100%..+100% with explicit sign).
      function formatParamValue(idx, raw) {
        // idx order: 0=DETU, 1=RATE, 2=SPEE, 3=SUB, 4=SUB2, 5=SATU, 6=FOLD, 7=ASYM, 8=WAV1, 9=WAV2
        if (idx === 8 || idx === 9)
          return String(Math.round((raw / 1023) * 90));
        if (idx === 7) {
          const pct = Math.round((raw * 200) / 1023) - 100;
          return (pct >= 0 ? "+" : "") + pct + "%";
        }
        if (idx === 0) {
          const cents = Math.round((raw - 511) / 511 * 50);
          return (cents >= 0 ? "+" : "") + cents + " c";
        }
        if (idx === 5)
          return String(Math.round((raw / 1023) * 300));
        return Math.round((raw * 100) / 1023) + "%";
      }

      function createSlider(wasmProcessor, param, index) {
        let container = document.createElement("div");

        let label = document.createElement("label");
        label.textContent = param.name.toLowerCase();
        label.style.display = "inline-block";
        label.style.width = "100px";
        label.style.marginRight = "10px";
        container.appendChild(label);

        let value_string = document.createElement("span");
        container.appendChild(value_string);

        // Emscripten's API creates these from a C array, indexing them instead of a
        // name. Chrome and FF work with 0 but Safari requires the correct "0".
        let audio_parameter = wasmProcessor.parameters.get(`${index}`);

        // Stable ids for cross-control sync.
        const controlId = "param_" + index;
        // Parameter roles (see header.c):
        //   index 0 "PARAM"   - fixed knob A: no-op stub (render disabled)
        //   index 1 "VALUE"   - fixed knob B: no-op stub (render disabled)
        //   index 2 "PARAM SEL" - optional: parameter selector dropdown (0..9)
        //   index 3 "PARAM VAL" - optional: value of the selected parameter
        // The fixed PARAM / VALUE knobs are no-op stubs on hardware (type_none),
        // so the simulator renders them as disabled sliders for layout parity.
        if (index === 0 || index === 1) {
          let input = document.createElement("input");
          input.type = "range";
          input.min = 0;
          input.max = 1023;
          input.step = 1;
          input.value = 0;
          input.id = controlId;
          input.disabled = true;
          input.title = "No-op stub: use PARAM SEL / PARAM VAL instead";
          input.style.width = "200px";
          input.style.marginRight = "10px";
          container.appendChild(input);
          value_string.textContent = "stub";
        } else if (index === 2) {
          // PARAM SEL: parameter selector. Render a <select> with one option
          // per selectable parameter (param.min..param.max). The option text
          // comes from getParameterValueString(index, i), which returns the
          // parameter name.
          let select = document.createElement("select");
          select.id = controlId;
          select.style.width = "200px";
          select.style.marginRight = "10px";
          for (let i = param.min; i <= param.max; ++i) {
            let opt = document.createElement("option");
            opt.value = i;
            opt.textContent = Module.getParameterValueString(index, i);
            if (i === param.init) opt.selected = true;
            select.appendChild(opt);
          }
          container.appendChild(select);
          value_string.textContent = Module.getParameterValueString(index, select.value);
          select.onchange = () => {
            value_string.textContent = Module.getParameterValueString(index, select.value);
            audio_parameter.value = select.value;
            const valueSlider = document.getElementById("param_3");
            if (valueSlider) {
              // Read the processor's cache directly (no worklet round-trip).
              // getSelectParam() / getEditParamValue() are exported from
              // wasm.cc and read the processor's select_ / edit_value_.
              const newSelect = parseInt(select.value, 10);
              const raw = Module.getEditParamValue ? Module.getEditParamValue(newSelect) : 0;
              valueSlider.value = raw;
              const valueSpan = valueSlider.parentElement.querySelector("span");
              if (valueSpan)
                valueSpan.textContent = formatParamValue(newSelect, raw);
            }
          };
        } else {
          // PARAM VAL (optional, index 3): plain range slider editing the raw
          // 10-bit value (0..1023) of the currently selected parameter.
          let input = document.createElement("input");
          input.type = "range";
          input.min = param.min;
          input.max = param.max;
          input.step = 1;
          input.value = param.init;
          input.id = controlId;
          input.style.width = "200px";
          input.style.marginRight = "10px";
          container.appendChild(input);
          // Initialize the display from the processor's cached value of the
          // currently selected parameter (not the raw 0 that param.init
          // would show). The PARAM SEL dropdown is created before the PARAM
          // VAL slider, so it is already in the DOM.
          const sel = document.getElementById("param_2");
          if (sel) {
            const idx = parseInt(sel.value, 10);
            const raw = Module.getEditParamValue ? Module.getEditParamValue(idx) : 0;
            input.value = raw;
            value_string.textContent = formatParamValue(idx, raw);
          } else {
            value_string.textContent = Module.getParameterValueString(index, input.value);
          }
          input.oninput = () => {
            audio_parameter.value = input.value;
            const sel2 = document.getElementById("param_2");
            if (sel2) {
              const idx = parseInt(sel2.value, 10);
              value_string.textContent = formatParamValue(idx, input.value);
            } else {
              value_string.textContent = Module.getParameterValueString(index, input.value);
            }
          };
        }

        document.getElementById("Parameters").appendChild(container);
      }

      // audio graph
      // let oscillator = new OscillatorNode(context, { frequency: 440.0 });
      let envelope = new GainNode(context, { gain: 1.0 }); // unity gain: the A-H-R envelope lives in the DSP (processor.noteOn/noteOff)
      let volume = new GainNode(context, { gain: 0.1 })
      let analyser = new AnalyserNode(context, { fftSize: 4096 });
      let data = new Float32Array(analyser.frequencyBinCount);

      // let noise = new AudioBufferSourceNode(context, { loop: true });
      // noise.buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
      // for (i = 0; i < context.sampleRate; i++) {
      //   noise.buffer.getChannelData(0)[i] = 2 * Math.random() - 1;
      // }

      wasmProcessor.connect(envelope).connect(volume).connect(context.destination);
      envelope.connect(analyser);

      // let samplesDiv = document.getElementById("Samples");
      // let audioElements = samplesDiv.getElementsByTagName("audio");
      // for (let audio of audioElements) {
      //   let source = context.createMediaElementSource(audio);
      //   source.connect(wasmProcessor);
      // }

      // resume/stop button
      let togglePlaybackButton = document.getElementById("TogglePlaybackButton");
      togglePlaybackButton.onclick = () => {
        if (context.state !== "running") {
          context.resume();
        } else {
          context.suspend();
        }
      };

      // Browsers start AudioContext in "suspended" state until a user
      // gesture, so playback is off by default. Resume automatically on
      // the first click/keypress so the user does not have to press the
      // Toggle playback button manually.
      const autoResume = () => {
        if (context.state !== "running") {
          context.resume();
        }
        // keep the listener for further pauses (e.g. tab-switch)
      };
      document.addEventListener("click", autoResume, true);
      document.addEventListener("keydown", autoResume, true);

      // main volume
      let volumeSlider = document.getElementById("VolumeSlider");
      let volumeLabel = document.getElementById("VolumeLabel");
      volume.gain.value = volumeSlider.value; // expontial ramp do not work here, need proper smoothing
      volumeLabel.innerText = volumeSlider.value;
      volumeSlider.oninput = function () {
        volume.gain.value = this.value;
        volumeLabel.innerText = this.value;
      };

      // BPM
      // let bpmSlider = document.getElementById("BpmSlider");
      // let bpmLabel = document.getElementById("BpmLabel");
      // bpmLabel.innerText = bpmSlider.value;

      // bpmSlider.oninput = function () {
      //   bpmLabel.innerText = this.value;
      //   Module.fx_set_bpm(this.value);
      // };

      // keyboard osc
      let currentOctave = 3;
      let keyboard = new QwertyHancock({
        id: "keyboard",
        width: 512,
        height: 64,
        octaves: currentOctave,
        startNote: "A2",
        whiteNotesColour: "white",
        blackNotesColour: "black",
        hoverColour: "#f3e939"
      });

      let osc_frequency = 440.0;

      let latchEnabled = false;
      let latchButton = document.getElementById("OscLatchButton");
      latchButton.onclick = function () {
        latchEnabled = !latchEnabled;
        this.innerText = `Latch ${latchEnabled ? "On" : "Off"}`;

        // Note: this unit runs its own single-voice A-H-R envelope (2 s exp
        // attack, hold while the key is held, 2 s exp release). The NTS-1 mkII
        // platform's own EG is set to oPEn on the device, so it does not
        // double-shape the signal.
      };

      keyboard.keyDown = function (note, frequency) {
        if (!window.frequencyStack) {
          window.frequencyStack = [];
        }
        window.frequencyStack.push(frequency);
        osc_frequency = frequency;
        Module.setOscPitch(osc_frequency);
        Module.noteOn(note, 100); // TODO: add a slider for velocity
        // noteOn starts (or restarts) the A-H-R sequence: 2 s exp attack,
        // then hold at full level while the key is held.
      };

      keyboard.keyUp = function (note, frequency) {
        if (!window.frequencyStack) {
          window.frequencyStack = [];
        }
        // Remove the frequency from the stack (last matching entry)
        for (let i = window.frequencyStack.length - 1; i >= 0; --i) {
          if (approximatelyEqual(window.frequencyStack[i], frequency)) {
            window.frequencyStack.splice(i, 1);
            break;
          }
        }

        // latest note priority
        if (window.frequencyStack.length > 0) {
          osc_frequency = window.frequencyStack[window.frequencyStack.length - 1];
          Module.setOscPitch(osc_frequency);
        }
        // Note: no host-side mute on key-up. noteOff triggers the 2 s
        // exponential release; the sound fades out on its own.

        Module.noteOff(note);
      };

      document.addEventListener("keydown", (e) => {
        if (e.key === "z") {
          currentOctave = Math.max(0, currentOctave - 1);
          keyboard.setKeyOctave(currentOctave);
        } else if (e.key === "x") {
          currentOctave = Math.min(7, currentOctave + 1);
          keyboard.setKeyOctave(currentOctave);
        }
      });

      // scope
      let canvasWave = document.getElementById("TimeDomain");
      let canvasFFT = document.getElementById("FrequencyDomain");
      let canvasWaveContext = canvasWave.getContext("2d");
      let canvasFFTContext = canvasFFT.getContext("2d");
      draw();
      function draw() {
        analyser.getFloatTimeDomainData(data);

        canvasWaveContext.fillStyle = "rgb(255, 255, 255)";
        canvasWaveContext.fillRect(0, 0, canvasWave.width, canvasWave.height);
        canvasWaveContext.lineWidth = 1;
        canvasWaveContext.strokeStyle = "rgb(0, 0, 0)";
        canvasWaveContext.beginPath();

        // find trigger point
        let start_index = 0;
        let score_max = 0.0;

        let dx = Math.floor(400 / osc_frequency) + 1;

        for (let i = dx; i < data.length / 2; ++i) {
          if ((data[i - 1] > 0) && (data[i + 1] < 0)) { // zero-cross point
            let score = (data[i - dx] - data[i + dx]) - data[i + 5 * dx];
            if (score > score_max) {
              score_max = score;
              start_index = i;
            }
          }
        }

        let num_of_half_cycles = Math.floor(analyser.fftSize * osc_frequency / context.sampleRate) - 1;
        let end_index = data.length - 1;
        if (num_of_half_cycles > 0) {
          end_index = Math.round(start_index + num_of_half_cycles * context.sampleRate / osc_frequency / 2);
        }

        let delta_x = canvasWave.width / (end_index - start_index);
        let x = 0;

        for (let i = start_index; i <= end_index; i++) {
          let v = data[i];
          let y = (v * 0.5 + 1.0) * canvasWave.height / 2; // -2..2 range

          if (i === start_index) {
            canvasWaveContext.moveTo(x, y);
          } else {
            canvasWaveContext.lineTo(x, y);
          }

          x += delta_x;
        }
        canvasWaveContext.stroke();

        analyser.getFloatFrequencyData(data);

        canvasFFTContext.clearRect(0, 0, canvasFFT.width, canvasFFT.height);

        let deltaX = canvasFFT.width / data.length;
        let posX = 0;
        for (let i = 0; i < data.length; i++) {
          let barHeight = data[i] + canvasFFT.height;
          canvasFFTContext.fillStyle = "rgb(0, 0, 0)";
          canvasFFTContext.fillRect(
            posX,
            canvasFFT.height - barHeight,
            deltaX,
            barHeight,
          );
          posX += deltaX;
        }
        requestAnimationFrame(draw);
      }

      // audio processor parameters
      let parameters = Module.getValidParameters();
      for (let i = 0; i < parameters.size(); ++i) {
        let param = parameters.get(i);
        createSlider(wasmProcessor, param, i);
      }

      // LFO (Shape) controls — simulator-only, mirrors the hardware OSC knobs
      const lfoFreq = document.getElementById("LfoFreq");
      const lfoDepth = document.getElementById("LfoDepth");
      const lfoFreqLabel = document.getElementById("LfoFreqLabel");
      const lfoDepthLabel = document.getElementById("LfoDepthLabel");

      function updateLfoFreq() {
        const v = parseFloat(lfoFreq.value);
        lfoFreqLabel.textContent = v.toFixed(2);
        Module.setLfoFreq(v);
      }
      function updateLfoDepth() {
        const v = parseInt(lfoDepth.value, 10);
        lfoDepthLabel.textContent = v + "%";
        Module.setLfoDepth(v / 100.0);
      }

      lfoFreq.addEventListener("input", updateLfoFreq);
      lfoDepth.addEventListener("input", updateLfoDepth);

      // initialize (defaults: F=1 Hz, S=0% = LFO off)
      updateLfoFreq();
      updateLfoDepth();
    };
  </script>
