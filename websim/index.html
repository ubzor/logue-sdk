<!DOCTYPE html>
<html lang="en" data-theme="light">
<!-- TODO: make sure headroom is the same as the hardware -->

<head>
  <meta charset="utf-8">
  <title>logue-sdk drone (chain)</title>
  <script src="scripts/qwerty-hancock.js"></script>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <!-- FlyonUI (Tailwind v4 + flyonui plugin), built by Vite: see scripts/app.css /
       vite.config.js in the websim/ dir. Loaded with relative paths because
       serve.sh serves sim/ as the document root.
       flyon.css = Tailwind utilities + flyonui base/theme layers + flyonui
                   component CSS (button/card/range/switch/badge/kbd/label/
                   divider), all compiled into one file by Vite from scripts/app.css.
       flyon.js  = the entry module (theme init). The flyonuiRepair plugin
                   (vite.flyonui.js) fixes flyonui's minified artifacts before
                   Lightning CSS runs, so the components import cleanly. -->
  <link rel="stylesheet" href="./flyon.css">
  <script type="module" src="./flyon.js"></script>
</head>

<body class="min-h-screen bg-base-100 text-base-content p-2">
  <!-- Full-width (no max-w-[1200px]) layout: at FHD the page uses the entire
       viewport width. Top row = title + ALL global controls + keyboard +
       scope, one line; bottom row = OSC parameters (2/3) + MOD/DEL/REV
       stack (1/3). min-w keeps the top row on one line (wide screen target). -->
  <div class="flex flex-col gap-2">

    <!-- ---- Top section: left controls column + right keyboard/scope -- -->
    <div class="flex flex-row gap-2">
      <!-- Left column: title + all global controls + theme switch -->
      <div class="flex flex-col gap-2 grow">
        <div class="flex items-center gap-2">
          <span id="DroneIcon" class="icon-[tabler--drone] text-base" role="img" aria-label="Drone"></span>
          <span class="text-sm font-semibold tracking-wide">DRONE</span>
        </div>

        <label class="flex items-center gap-3" title="Master output volume">
          <span class="w-20 text-xs font-medium shrink-0">Volume</span>
          <input type="range" min="0" max="1" value="1" step="0.01" id="VolumeSlider" class="range range-primary range-sm flex-1">
          <span id="VolumeLabel" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-xs text-right"></span>
        </label>

        <!-- BPM: simulator-only tempo control. Delivered to the DSP
             through Module.fx_set_bpm (wasm.cc -> Osc::setTempo ->
             tempo_bpm_). On hardware the platform delivers BPM itself
             via unit_set_tempo(); the slider here only matters in the
             web simulator. -->
        <label class="flex items-center gap-3" title="Simulator tempo (delivered to DSP via fx_set_bpm)">
          <span class="w-20 text-xs font-medium shrink-0">BPM</span>
          <input type="range" min="56" max="240" value="120" step="1" id="BpmSlider" class="range range-primary range-sm flex-1">
          <span id="BpmLabel" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-xs text-right"></span>
        </label>

        <label class="flex items-center gap-3" title="Simulates the hardware OSC-button A/B knobs: LFO frequency (Hz).">
          <span class="w-20 text-xs font-medium shrink-0">LFO F (Hz)</span>
          <input type="range" min="0" max="30" value="0" step="0.01" id="LfoFreq" class="range range-primary range-sm flex-1">
          <span id="LfoFreqLabel" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-xs text-right">0.00</span>
        </label>

        <label class="flex items-center gap-3" title="Simulates the hardware OSC-button A/B knobs: LFO depth (%)">
          <span class="w-20 text-xs font-medium shrink-0">LFO S (%)</span>
          <input type="range" min="0" max="100" value="0" step="1" id="LfoDepth" class="range range-primary range-sm flex-1">
          <span id="LfoDepthLabel" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-xs text-right">0%</span>
        </label>
      </div>

      <!-- Right column: octave + keyboard + scope -->
      <div class="flex flex-col gap-2 shrink-0">
        <!-- Octave (FlyonUI "Join radio with btn style", see
             https://flyonui.com/docs/forms/radio/#join-radio-with-btn-style):
             <div class="join drop-shadow"> with one input[type=radio]
             .join-item .btn .btn-soft per option; the checked input is
             painted primary by the flyonui .btn rule itself (see
             .octave-join in scripts/app.css). JS (setOctaveShift) only applies the
             shift and mirrors the Z/X hotkeys into .checked. -->
        <!-- Keyboard + Octave block (shared 507px width) + Scope -->
        <div class="flex flex-row items-start gap-2" style="height:128px">
          <!-- Octave + Keyboard: stacked vertically, shared 507px width -->
          <div class="flex flex-col shrink-0" style="width:507px;height:128px;justify-content: space-between;">
            <!-- Octave (FlyonUI "Join radio with btn style") -->
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium w-10 shrink-0">Octave</span>
              <div class="octave-join drop-shadow" title="Current octave shift of the whole keyboard range">
                <input class="octave-join-item btn btn-soft btn-primary btn-xs" type="radio" name="Octave" value="1" aria-label="1" title="Down two octaves (A0..D2)">
                <input class="octave-join-item btn btn-soft btn-primary btn-xs" type="radio" name="Octave" value="2" aria-label="2" title="Down one octave (A1..D3)" checked>
                <input class="octave-join-item btn btn-soft btn-primary btn-xs" type="radio" name="Octave" value="3" aria-label="3" title="Base range (A2..D4)">
                <input class="octave-join-item btn btn-soft btn-primary btn-xs" type="radio" name="Octave" value="4" aria-label="4" title="Up one octave (A3..D5)">
                <input class="octave-join-item btn btn-soft btn-primary btn-xs" type="radio" name="Octave" value="5" aria-label="5" title="Up two octaves (A4..D6)">
              </div>
              <input type="checkbox" id="ThemeSwitch" class="switch switch-primary switch-xs ml-auto" title="Toggle dark theme (VSCode) / light theme (Valorant)">
            </div>
            <!-- Keyboard (qwerty-hancock). Fixed 507px width, 96px height -->
            <div id="keyboard" class="shrink-0" style="width:507px"></div>
          </div>

          <!-- Scope: time-domain oscilloscope + FFT histogram (native buffers
               512x128, CSS .scope-canvas fixes the render at 512px, see scripts/app.css).
               Side by side in a row; the canvases carry their own
               --scope-bg background, so no card padding is needed. -->
          <div class="flex flex-row gap-2 shrink-0">
            <canvas id="TimeDomain" class="scope-canvas" width="512" height="128"></canvas>
            <canvas id="FrequencyDomain" class="scope-canvas" width="512" height="128"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- ====================== MAIN ROW: OSC 2/3 + FX 1/3 ==================== -->
    <div class="flex gap-4 items-stretch">

    <!-- ==================== OSC: parameters card (2/3 width) ================ -->
    <!-- The OSC edit-parameter groups (see PARAM_GROUPS in the script below).
         Three equal columns; groups are assigned column-by-column
         (MAIN/BREATH/FORMANT -> col 0; WANDER/WANDER TGT -> col 1;
         CHORD/SUBS/FILTER -> col 2) so the heights balance. The preset bank
         (Random/Reset buttons) sits above the grid, in one row. -->
    <!-- Border-less, padding-less container (flat panel): saves the card's
         chrome (border + card-body padding) around the parameter grid. -->
    <div class="min-w-0 flex-[2]">
      <div class="flex flex-col items-stretch gap-3">
        <!-- ---- Preset bank (Random/Reset) -------------------------------- -->
        <div class="flex flex-wrap gap-2" id="Presets"></div>
        <div id="Parameters" class="grid grid-cols-3 gap-x-8 gap-y-4 items-stretch">
          <div id="ParamCol0" class="flex flex-col justify-between gap-2"></div>
          <div id="ParamCol1" class="flex flex-col gap-2"></div>
          <div id="ParamCol2" class="flex flex-col justify-between gap-2"></div>
        </div>
      </div>
    </div>

    <!-- ==================== FX: MOD / DEL / REV stack (1/3) ================== -->
    <!-- The audio path OSC -> MOD -> DEL -> REV runs inside the wasm worklet.
         MOD uses TWO PARAM/VALUE multiplexers (like the OSC, but doubled):
         TIME / DEPTH are fixed knobs (setFxParam), the 5 MOD-group edit params
         (DRIFT / CMODE / CHOR / FLNGR / ENSMBL) are driven through
         Module.modSetEditParam(idx, raw), and the 5 TAPE-group edit params
         (NOISE / NRATE / TAPWOB / HISS / WARP, KoS-derived) through
         Module.modSetTapeParam(idx, raw). DEL / REV keep their own TIME /
         DEPTH via setFxParam. The three cards stack vertically in the right
         third of the page. -->
    <div class="flex flex-col gap-4 min-w-0 flex-[1]">

    <!-- ---- MOD card (TIME / DEPTH + two multiplexer groups) --------------- -->
      <div class="card card-border shadow-none w-full">
        <div class="card-body flex-col items-stretch !gap-3 pt-4">
          <div class="flex items-center justify-between">
            <div class="text-xs uppercase tracking-wide opacity-60">Mod</div>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="fxmod_bypass" class="switch switch-primary switch-xs" checked>
            </label>
          </div>
          <div id="fxmod_body" class="flex flex-col gap-2 fx-params">
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Time</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxmod_time" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_time_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">25%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Depth</span>
            <input type="range" min="0" max="1023" value="511" step="1" id="fxmod_depth" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_depth_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">50%</span>
          </label>
          <!-- ===== MODULATION group (first PARAM/VALUE multiplexer, slots 2/3) -->
          <!-- idx 0..4 = DRIFT / CMODE / CHOR / FLNGR / ENSMBL, driven through
               Module.modSetEditParam(idx, raw) (atomic PARAM_SEL+PARAM_VAL). -->
          <div class="text-xs uppercase tracking-wide opacity-60 mt-1">Modulation</div>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Drift</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_drift" data-modedit="0" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_drift_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Chorus Mode</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_cmode" data-modedit="1" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_cmode_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">I</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Chorus</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_chorus" data-modedit="2" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_chorus_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Flanger</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_flanger" data-modedit="3" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_flanger_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Ensemble</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_ensemble" data-modedit="4" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_ensemble_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>

          <!-- ===== TAPE group (second PARAM/VALUE multiplexer, slots 4/5) -->
          <!-- idx 0..4 = NOISE / NRATE / TAPWOB / HISS / WARP (KoS-derived), driven
               through Module.modSetTapeParam(idx, raw) (atomic TPARAM+TVALUE). -->
          <div class="text-xs uppercase tracking-wide opacity-60 mt-1">Tape</div>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Noise</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_noise" data-modtape="0" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_noise_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">N Rate</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_nrate" data-modtape="1" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_nrate_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Tape Wob</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_tapwob" data-modtape="2" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_tapwob_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Hiss</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_hiss" data-modtape="3" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_hiss_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Warp</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxmod_warp" data-modtape="4" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxmod_warp_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          </div><!-- /fxmod_body -->
        </div>
      </div>

      <!-- ---- DEL card ---------------------------------------------------- -->
      <div class="card card-border shadow-none w-full">
        <div class="card-body flex-col items-stretch !gap-3 pt-4">
          <div class="flex items-center justify-between">
            <div class="text-xs uppercase tracking-wide opacity-60">Del</div>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="fxdel_bypass" class="switch switch-primary switch-xs" checked>
            </label>
          </div>
          <div id="fxdel_body" class="flex flex-col gap-2 fx-params">
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Time</span>
            <input type="range" min="0" max="1023" value="0" step="1" id="fxdel_time" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxdel_time_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Depth</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxdel_depth" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxdel_depth_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">50%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Mix</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxdel_mix" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxdel_mix_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          </div><!-- /fxdel_body -->
        </div>
      </div>

      <!-- ---- REV card ---------------------------------------------------- -->
      <div class="card card-border shadow-none w-full">
        <div class="card-body flex-col items-stretch !gap-3 pt-4">
          <div class="flex items-center justify-between">
            <div class="text-xs uppercase tracking-wide opacity-60">Rev</div>
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="fxrev_bypass" class="switch switch-primary switch-xs" checked>
            </label>
          </div>
          <div id="fxrev_body" class="flex flex-col gap-2 fx-params">
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Time</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxrev_time" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxrev_time_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">50%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Depth</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxrev_depth" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxrev_depth_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">50%</span>
          </label>
          <label class="flex items-center gap-3">
            <span class="w-32 text-sm font-medium shrink-0">Mix</span>
            <input type="range" min="0" max="1023" value="512" step="1" id="fxrev_mix" class="range range-primary range-sm flex-1 min-w-0">
            <span id="fxrev_mix_val" class="badge badge-soft badge-primary badge-sm font-mono shrink-0 min-w-14 text-right">0%</span>
          </label>
          </div><!-- /fxrev_body -->
        </div>
      </div>

    </div><!-- /FX stack -->

    </div><!-- /main row -->

  </div>

  <!-- Simulator UI: declares window.setupWebAudioAndUI, which the
       emscripten glue code (drone.js, linked below via {{{ SCRIPT }}}) calls
       once the wasm worklet module is ready. Classic (non-module) script,
       loaded before the glue. -->
  <script src="scripts/setup-web-audio.js"></script>
  <!-- Emscripten replaces this placeholder with the glue script
       (<script async type="text/javascript" src="drone.js"></script>)
       when linking with --shell-file. It is mandatory: tools/link.py
       aborts the build if the placeholder is missing. Leave as-is. -->
  {{{ SCRIPT }}}
</body>

</html>
